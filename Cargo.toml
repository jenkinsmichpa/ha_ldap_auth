[package]
name = "ha_ldap_auth"
version = "1.0.3"
authors = ["Michael Jenkins <jenkinsmichpa@gmail.com>"]
edition = "2024"
description = "Performs LDAP searches to provide command line authentication to Home Assistant"

[dependencies]
clap = { version = "4.6.5", features = ["derive", "cargo"] }
ldap3 = { version = "0.12.1", default-features = false, features = [
  "sync",
  "tls-rustls-ring",
] }
url = "2.5.8"
ldapdn = "1.0.0"

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
strip = true
